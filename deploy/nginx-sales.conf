# Photobuy sotuv — reverse proxy. Node API faqat 127.0.0.1:8200, Next.js sahifalari 127.0.0.1:3000; tashqariga faqat nginx (80/443).
# /api va /webhook to‘g‘ridan-to‘g‘ri Node’ga (Meta veb-huki, uzun AI so‘rovlari, audio Range); sahifalar Next.js’ga.
# proxy_cache yoqilmaydi (Next o‘zi keshlash sarlavhalarini beradi).
limit_req_zone $binary_remote_addr zone=sales_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 8m;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /api/login {
        limit_req zone=sales_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8200;
        include /etc/nginx/snippets/sales-proxy.conf;
        proxy_read_timeout 90s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8200;
        include /etc/nginx/snippets/sales-proxy.conf;
        proxy_read_timeout 180s;
    }
    location /webhook/ {
        proxy_pass http://127.0.0.1:8200;
        include /etc/nginx/snippets/sales-proxy.conf;
        proxy_read_timeout 90s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/sales-proxy.conf;
        proxy_read_timeout 90s;
    }
}
